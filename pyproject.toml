[project]
name = "landedcost-ai"
version = "0.1.0"
description = "HTS classification with cited tariff text, abstention and landed-cost estimates, built on hybrid pgvector + full-text retrieval."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anisha V. Shah" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3",
    "fastapi>=0.162",
    "httpx>=0.28",
    "jinja2>=3.1",
    "numpy>=2.2",
    "openai>=3.37",
    "pgvector>=0.5",
    "psycopg[binary]>=3.3",
    "psycopg-pool>=3.3",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "typer>=0.27",
    "uvicorn[standard]>=0.54",
]

[project.optional-dependencies]
fastembed = ["fastembed>=0.9"]

[project.scripts]
landedcost = "landedcost.cli:app"

[dependency-groups]
dev = [
    "httpx2>=2.16",  # imported by the provider tests (anthropic's HTTP client)
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.0",
    "ruff>=0.17",
    "testcontainers[postgres]>=4.15",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/landedcost"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "N", "ASYNC", "PT", "PERF", "S", "T20", "RET", "PTH",
]
ignore = [
    "S101",   # assert is fine in tests and for type narrowing
    "S608",   # SQL is built from module constants only; values are always bound parameters
    "RUF001", # the cent sign and similar characters are intentional in tariff text
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "PLR2004"]
"scripts/**" = ["T20", "S310"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unreachable = true
mypy_path = "src"
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = ["fastembed", "fastembed.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: needs PostgreSQL with pgvector (LANDEDCOST_TEST_DATABASE_URL)",
]
filterwarnings = ["error::DeprecationWarning:landedcost.*"]
